name: Publish OCI image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: amiga-dev-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ploos-as/amiga-dev
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=amiga-dev-full
            type=registry,ref=ghcr.io/ploos-as/amiga-dev:buildcache
          cache-to: |
            type=gha,mode=max,scope=amiga-dev-full
            type=registry,ref=ghcr.io/ploos-as/amiga-dev:buildcache,mode=max

      - name: Attest published image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/ploos-as/amiga-dev
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub build-provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://ghcr.io/ploos-as/amiga-dev@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify OCI SBOM and provenance attestations
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/ploos-as/amiga-dev@${IMAGE_DIGEST}" \
            --format '{{ json .Provenance }}' > /tmp/provenance.json
          docker buildx imagetools inspect \
            "ghcr.io/ploos-as/amiga-dev@${IMAGE_DIGEST}" \
            --format '{{ json .SBOM }}' > /tmp/sbom.json
          test -s /tmp/provenance.json
          test -s /tmp/sbom.json
          test "$(cat /tmp/provenance.json)" != "null"
          test "$(cat /tmp/sbom.json)" != "null"
          jq -e . /tmp/provenance.json >/dev/null
          jq -e . /tmp/sbom.json >/dev/null
