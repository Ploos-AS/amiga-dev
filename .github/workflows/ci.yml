name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amiga-dev image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amiga-dev:m1
          cache-from: type=gha,scope=amiga-dev-full
          cache-to: type=gha,mode=max,scope=amiga-dev-full
      - name: Run baseline smoke test
        run: docker run --rm amiga-dev:m1 amiga-dev-smoke
      - name: Report toolchain
        run: docker run --rm amiga-dev:m1 amiga-toolchain-info
      - name: Compile minimal 68000 executable
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            amiga-dev:m1 \
            m68k-amigaos-gcc -m68000 -Os -Wall -Wextra -Werror \
              tests/hello.c -o /tmp/hello-amiga
      - name: Verify compiler target
        run: docker run --rm amiga-dev:m1 m68k-amigaos-gcc -dumpmachine | grep -Fx m68k-amigaos
