name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build M0 image
        run: docker build --tag amiga-dev:m0 .
      - name: Run M0 smoke test
        run: docker run --rm amiga-dev:m0 amiga-dev-smoke
