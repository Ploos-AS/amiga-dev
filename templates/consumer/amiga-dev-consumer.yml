name: Amiga build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  amiga-build:
    runs-on: ubuntu-latest
    env:
      AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
      AMIGA_CPU_PROFILE: "68000"
    steps:
      - uses: actions/checkout@v4
      - name: Pull amiga-dev
        run: docker pull "$AMIGA_DEV_IMAGE"
      - name: Verify amiga-dev contract
        run: docker run --rm "$AMIGA_DEV_IMAGE" amiga-check
      - name: Build project
        run: |
          docker run --rm \
            -e AMIGA_CPU_PROFILE="$AMIGA_CPU_PROFILE" \
            -v "$PWD:/workspace" \
            "$AMIGA_DEV_IMAGE" \
            amiga-build make check

# Migration note:
# Replace :edge with a qualified immutable sha-* tag, semantic release, or digest
# before treating this workflow as a reproducible release qualification boundary.
